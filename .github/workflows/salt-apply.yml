name: Salt highstate apply

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  salt-apply:
    name: Apply local highstate
    runs-on: [self-hosted, salt-master-01]
    timeout-minutes: 30
    steps:
      - name: Check out tested commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Apply all local states
        run: |
          sudo -n salt-call --local \
            --file-root=/srv/actions-runner/_work/salt/salt/salt \
            --pillar-root=/srv/actions-runner/_work/salt/salt/pillar \
            state.highstate --retcode-passthrough
