name: Salt test and apply

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      skip_dry_run:
        description: Apply directly without the Salt test-mode gate
        type: boolean
        default: false
        required: false
      update_k3s:
        description: Upgrade K3s nodes to the latest stable release or a specified version
        type: boolean
        default: false
        required: false
      k3s_version:
        description: Optional exact K3s release tag (for example v1.37.1+k3s1); blank uses latest stable
        type: string
        default: ''
        required: false
      recover_k3s_passwd:
        description: Back up and remove the control-plane passwd file before upgrading
        type: boolean
        default: false
        required: false
      inspect_k3s:
        description: Run read-only diagnostics for the K3s nodes and latest upgrade state
        type: boolean
        default: false
        required: false

permissions:
  contents: read

concurrency:
  group: salt-master-01
  cancel-in-progress: false

jobs:
  configuration-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run --no-project --with-requirements tests/requirements.txt python -m unittest discover -s tests -v

  salt-test:
    if: >-
      github.event_name != 'pull_request' &&
      inputs.skip_dry_run != true &&
      inputs.update_k3s != true &&
      inputs.inspect_k3s != true
    needs: configuration-tests
    name: Test local highstate
    runs-on: [self-hosted, salt-master-01]
    timeout-minutes: 30
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Run Salt in test mode
        run: |
          sudo -n salt-call --local \
            --file-root="$GITHUB_WORKSPACE/salt" \
            --pillar-root="$GITHUB_WORKSPACE/pillar" \
            state.apply salt.master test=True queue=True --retcode-passthrough

  salt-apply:
    name: Apply local highstate
    needs: [configuration-tests, salt-test]
    if: >-
      always() && github.event_name != 'pull_request' &&
      needs.configuration-tests.result == 'success' &&
      inputs.update_k3s != true &&
      inputs.inspect_k3s != true &&
      (needs.salt-test.result == 'success' || inputs.skip_dry_run == true)
    runs-on: [self-hosted, salt-master-01]
    timeout-minutes: 30
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Seed master-only Tailscale API credential
        env:
          TS_API_KEY: ${{ secrets.TS_API_KEY }}
        run: |
          test -n "$TS_API_KEY"
          sudo -n test -d /etc/salt/tailscale || sudo -n install -d -m 0700 /etc/salt/tailscale
          printf '%s' "$TS_API_KEY" | sudo -n sh -c 'umask 077; cat > /etc/salt/tailscale/api-key.new && mv /etc/salt/tailscale/api-key.new /etc/salt/tailscale/api-key'

      - name: Seed inference backend pillar for GPU minions
        env:
          LITELLM_BACKEND_KEY: ${{ secrets.LITELLM_BACKEND_KEY }}
          HUGGING_FACE_ACCESS_KEY: ${{ secrets.HUGGING_FACE_ACCESS_KEY }}
        run: |
          test -n "$LITELLM_BACKEND_KEY"
          test -n "$HUGGING_FACE_ACCESS_KEY"
          printf '%s\n%s\n' "$LITELLM_BACKEND_KEY" "$HUGGING_FACE_ACCESS_KEY" | sudo -n python3 -c '
          import json
          import os
          import pwd
          import re
          import subprocess
          import sys
          from pathlib import Path

          key, hf_key = sys.stdin.read().splitlines()
          for name, value in (("LITELLM_BACKEND_KEY", key), ("HUGGING_FACE_ACCESS_KEY", hf_key)):
              if not value or any(c in value for c in "\r\n"):
                  raise ValueError(f"{name} must be a nonempty single-line value")
          service_user = subprocess.check_output(
              ["systemctl", "show", "salt-master", "--property=User", "--value"],
              text=True,
          ).strip()
          if not service_user or service_user == "root":
              service_user = ""
              paths = [Path("/etc/salt/master")]
              paths.extend(sorted(Path("/etc/salt/master.d").glob("*.conf")))
              for path in paths:
                  try:
                      lines = path.read_text().splitlines()
                  except FileNotFoundError:
                      continue
                  for line in lines:
                      match = re.match(r"\s*user\s*:\s*['\"]?([^'\"#\s]+)", line)
                      if match:
                          service_user = match.group(1)
              service_user = service_user or "root"
          account = pwd.getpwnam(service_user)
          pillar = Path("/etc/salt/tailscale/pillar")
          root = pillar / "hosts"
          for directory in (pillar, root):
              directory.mkdir(parents=True, exist_ok=True, mode=0o700)
              os.chown(directory, account.pw_uid, account.pw_gid)
              directory.chmod(0o700)
          for node in ("mlops-node-4", "mlops-node-6", "mlops-node-7", "mlops-node-9"):
              directory = root / node
              directory.mkdir(exist_ok=True, mode=0o700)
              os.chown(directory, account.pw_uid, account.pw_gid)
              directory.chmod(0o700)
              for name, value in (("INFERENCE_BACKEND_KEY", key), ("HUGGING_FACE_ACCESS_KEY", hf_key)):
                  target = directory / name
                  temporary = directory / f".{name}.new"
                  temporary.write_text(json.dumps(value) + "\n")
                  os.chown(temporary, account.pw_uid, account.pw_gid)
                  temporary.chmod(0o600)
                  temporary.replace(target)
          '

      - name: Bootstrap Salt master and enrollment credentials
        run: |
          sudo -n salt-call --local \
            --file-root=/srv/actions-runner/_work/salt/salt/salt \
            --pillar-root=/srv/actions-runner/_work/salt/salt/pillar \
            state.apply salt.master queue=True --retcode-passthrough
          sudo -n systemctl show salt-master --property=User --property=ActiveState
          sudo -n salt-run --log-level=error --out=json salt.cmd config.get ext_pillar
          sudo -n salt-run --log-level=error --out=json pillar.show_pillar minion=mlops-node-0 |
            python3 -c 'import json, sys; data = json.load(sys.stdin); assert isinstance(data, dict), "Pillar compilation failed"; print("Master-compiled pillar keys:", sorted(data)); assert "TAILSCALE_AUTH_KEY" in data, "Enrollment pillar is missing"'

      - name: Verify GPU minions are reachable
        run: |
          set -o pipefail
          sudo -n salt --static --out=json --timeout=60 \
            -L 'mlops-node-4,mlops-node-6,mlops-node-7,mlops-node-9' test.ping |
            python3 -c 'import json, sys; data = json.load(sys.stdin); expected = {"mlops-node-4", "mlops-node-6", "mlops-node-7", "mlops-node-9"}; assert set(data) == expected and all(value is True for value in data.values()), f"GPU minion ping failed: {data}"; print("All GPU minions responded to Salt")'

      - name: Verify model credentials are scoped to GPU minions
        run: |
          for node in mlops-node-4 mlops-node-6 mlops-node-7 mlops-node-9; do
            sudo -n salt-run --log-level=error --out=json pillar.show_pillar minion="$node" |
              python3 -c 'import json,sys; d=json.load(sys.stdin); assert d.get("INFERENCE_BACKEND_KEY") and d.get("HUGGING_FACE_ACCESS_KEY"), "Model credential pillar missing"; print("Model credential pillars present for authorized GPU minion")'
          done
          sudo -n salt-run --log-level=error --out=json pillar.show_pillar minion=mlops-node-0 |
            python3 -c 'import json,sys; d=json.load(sys.stdin); assert "INFERENCE_BACKEND_KEY" not in d and "HUGGING_FACE_ACCESS_KEY" not in d, "Model credential pillar leaked to unauthorized minion"; print("Model credential pillars absent from non-GPU minion")'

      - name: Apply inference backend state to GPU minions
        run: sudo -n salt --timeout=300 -L 'mlops-node-4,mlops-node-6,mlops-node-7,mlops-node-9' state.apply mlops.backend queue=True

      - name: Apply HTTPS reverse proxy to GPU minions
        run: sudo -n salt --timeout=300 -L 'mlops-node-4,mlops-node-6,mlops-node-7,mlops-node-9' state.apply httpd queue=True

      - name: Install Hugging Face credentials on model downloaders
        run: sudo -n salt --timeout=300 -L 'mlops-node-4,mlops-node-6,mlops-node-7,mlops-node-9' state.apply mlops.huggingface queue=True

      - name: Recover K3s passwd if its startup guard fired
        run: sudo -n python3 "$GITHUB_WORKSPACE/salt/tailscale/deploy.py" --recover-passwd-only

      - name: Enroll minions and deploy Kubernetes nodes
        run: sudo -n python3 "$GITHUB_WORKSPACE/salt/tailscale/deploy.py"

  k3s-update:
    name: Upgrade K3s cluster
    needs: configuration-tests
    if: >-
      github.event_name == 'workflow_dispatch' &&
      inputs.update_k3s == true &&
      inputs.inspect_k3s != true
    runs-on: [self-hosted, salt-master-01]
    timeout-minutes: 45
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Upgrade K3s release
        env:
          K3S_UPGRADE_VERSION: ${{ inputs.k3s_version }}
          RECOVER_K3S_PASSWD: ${{ inputs.recover_k3s_passwd }}
        run: |
          args=()
          if [ "$RECOVER_K3S_PASSWD" = "true" ]; then
            args+=(--recover-passwd)
          fi
          if [ -n "$K3S_UPGRADE_VERSION" ]; then
            args+=(--version "$K3S_UPGRADE_VERSION")
          fi
          sudo -n python3 "$GITHUB_WORKSPACE/salt/tailscale/upgrade_k3s.py" "${args[@]}"

  k3s-inspect:
    name: Inspect K3s nodes
    needs: configuration-tests
    if: github.event_name == 'workflow_dispatch' && inputs.inspect_k3s == true
    runs-on: [self-hosted, salt-master-01]
    timeout-minutes: 10
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false

      - name: Inspect latest K3s upgrade state result
        run: |
          sudo -n python3 - <<'PY'
          import json
          import subprocess

          jobs = json.loads(subprocess.check_output(
              ["salt-run", "--log-level=error", "--out=json", "jobs.list_jobs"],
              text=True,
          ))
          candidates = [
              (jid, job)
              for jid, job in jobs.items()
              if job.get("Function") == "state.apply"
              and "k3s.upgrade" in job.get("Arguments", [])
          ]
          if not candidates:
              raise SystemExit("No cached state.apply k3s.upgrade job found")

          jid = max(candidates, key=lambda candidate: candidate[0])[0]
          result = json.loads(subprocess.check_output(
              ["salt-run", "--log-level=error", "--out=json", "jobs.lookup_jid", jid],
              text=True,
          ))
          failures = [
              {
                  "jid": jid,
                  "minion": minion,
                  "state": state_id,
                  "comment": state.get("comment"),
                  "changes": state.get("changes"),
              }
              for minion, states in result.items()
              for state_id, state in states.items()
              if isinstance(state, dict) and state.get("result") is False
          ]
          if not failures:
              raise SystemExit(f"Cached upgrade job {jid} contains no failed states")
          print(json.dumps(failures, indent=2))
          PY

      - name: Inspect K3s versions, services, and recent logs
        if: always()
        run: |
          sudo -n salt --static --out=json \
            -L 'k3s-control-plane-01,mlops-node-0,mlops-node-1' \
            cmd.run '
              unit=k3s
              if ! systemctl cat "$unit" >/dev/null 2>&1; then unit=k3s-agent; fi
              printf "VERSION\n"
              /usr/local/bin/k3s --version 2>&1
              printf "\nSERVICE: %s\n" "$unit"
              systemctl show "$unit" -p ActiveState -p SubState -p ExecMainStatus
              printf "\nRECENT_RELEVANT_LOGS\n"
              journalctl -u "$unit" --since "2 hours ago" --no-pager -g "passwd|datastore|etcd|no leader|failed|error|fatal" -n 30
            '
